# Keycloak local do RODAR. Sobe com: cp .env.example .env && docker compose up -d
name: rodar-keycloak
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - kc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-26.4}
    # start-dev: HTTP, sem cache distribuído, hostname dinâmico (o issuer segue o host da requisição,
    # então o celular na mesma rede acessa por http://<ip-da-maquina>:8180).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KC_PORT:-8180}:8080"
    healthcheck:
      # A imagem não tem curl: lê /health/ready da porta de gestão (9000) pelo bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      # Tema de login RODAR. Em start-dev o cache de tema fica desligado: editar e recarregar a página.
      - ./themes/rodar:/opt/keycloak/themes/rodar:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Aplica temas no master e as Organizations (empresas) do realm rodar, e sai. Ver scripts/configure.sh.
  kc-setup:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-26.4}
    entrypoint: ["/bin/bash", "/scripts/configure.sh"]
    environment:
      KC_ADMIN_USER: ${KC_ADMIN_USER:-admin}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    volumes:
      - ./scripts/configure.sh:/scripts/configure.sh:ro
      - ./realm/organizations.conf:/config/organizations.conf:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

volumes:
  kc-db:
