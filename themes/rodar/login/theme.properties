# Tema de login RODAR: herda as páginas do keycloak.v2 e troca layout (template.ftl) e visual (css/rodar.css).
# Tokens iguais aos de rodar-web (src/index.css) e rodar-mobile (tailwind.config.js).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/rodar.css
# Sempre escuro, como o app e o painel (o template já põe a classe do PatternFly dark).
darkMode=false
kcHtmlClass=login-pf rodar pf-v5-theme-dark

locales=pt-BR,en
