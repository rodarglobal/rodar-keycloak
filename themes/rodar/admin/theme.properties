# Console de administração RODAR: o app React do keycloak.v2 com logo, ícone, título e cores da marca.
# O layout do console não muda; o visual vem de css/rodar-admin.css (variáveis do PatternFly 5).
parent=keycloak.v2

title=RODAR · Administração
description=Administração de acesso do RODAR (Keycloak).
favIcon=/img/rodar-icone.svg
logo=/img/rodar-logo.svg

styles=css/rodar-admin.css
scripts=js/rodar-dark.js
# Sempre escuro, como o app e o painel web (js/rodar-dark.js põe a classe do PatternFly dark).
darkMode=false
kcDarkModeClass=pf-v5-theme-dark
